[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crypt"
version = "0.1.0"
description = "Simple string encryption/decryption CLI"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
crypt = "main:main"

[tool.setuptools]
py-modules = [
    "main",
    "parser",
    "encryption",
    "decryption",
    "utils",
]